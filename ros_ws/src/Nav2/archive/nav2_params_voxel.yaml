local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 125
      height: 125
      footprint: "[[2.2,0.7],[2.2,-0.7],[-0.8,-0.7],[-0.8,0.7]]"
      
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: nonground
        nonground:
          topic: /points_nonground
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_min_range: 1.0
          obstacle_max_range: 30.0
          raytrace_min_range: 1.0
          raytrace_max_range: 35.0
          min_obstacle_height: -2.0
          max_obstacle_height:  2.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.0
        cost_scaling_factor: 3.0




controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    # Nav2 controllers output to cmd_vel by default
    cmd_vel_topic: /cmd_vel

    # Important: make sure this matches your odom topic/frame
    odom_topic: /odometry/filtered

    global_frame: odom
    robot_base_frame: base_link

    # Required plugins
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- Core tuning knobs ---
      desired_linear_vel: 5.0            # start conservative (0.5 to 2.0)
      lookahead_dist: 3.0                # bigger for higher speed / smoother
      min_lookahead_dist: 1.5
      max_lookahead_dist: 8.0
      lookahead_time: 1.5                # alternative dynamic lookahead
      transform_tolerance: 0.2

      # slows down in tight curvature or near obstacles
      use_velocity_scaled_lookahead_dist: true
      velocity_scaled_lookahead_dist: 1.5
      min_velocity_scaled_lookahead_dist: 1.5
      max_velocity_scaled_lookahead_dist: 8.0

      # collision-aware regulation using costmap
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      # rotation behavior (for car-like platforms you usually disable in-place spins)
      use_rotate_to_heading: false
      allow_reversing: false

      # limits (match what your platform can do)
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0

    # Progress Checker and Goal Checker which are required by Nav2
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.8
      yaw_goal_tolerance: 0.5
      stateful: true



