# https://github.com/ros-navigation/navigation2/tree/humble/nav2_mppi_controller
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /Odometry
    cmd_vel_topic: /cmd_vel
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.000 # Can't drive in y direction
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # xy_goal_tolerance: 0.5
      # yaw_goal_tolerance: 0.35
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.5
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Ackermann"

      # Core horizon
      time_steps: 30 # 40
      model_dt: 0.05
      batch_size: 600 # 1000
      iteration_count: 1

      # Velocity limits
      vx_max: 2.0
      vx_min: 0.0
      wz_max: 0.6

      # Acceleration limits
      ax_max: 1.5
      ax_min: -2.0
      az_max: 1.2

      # Sampling noise
      vx_std: 0.2
      wz_std: 0.2

      # MPPI shaping
      temperature: 0.3
      gamma: 0.015
      regenerate_noises: false
      reset_period: 1.0   # Humble-specific

      # Debug visualization
      visualize: true
      publish_optimal_trajectory: true

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: true

      AckermannConstraints:
        min_turning_r: 4.5

      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        threshold_to_consider: 0.5
        offset_from_furthest: 20

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

