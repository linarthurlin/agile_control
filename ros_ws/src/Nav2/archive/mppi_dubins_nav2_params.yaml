local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 50.0
      height: 50.0
      resolution: 0.15
      footprint: "[[3.3,1.25],[3.3,-1.25],[-1.2,-1.25],[-1.2,1.25]]"

      track_unknown_space: false
      always_send_full_costmap: true
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2

      plugins: ["stvl_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true

        # Core STVL settings
        voxel_decay: 10.0
        decay_model: 0
        voxel_size: 0.10
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0

        observation_sources: velodyne

        velodyne:
          data_type: PointCloud2
          topic: /velodyne_points
          marking: true
          clearing: true
          obstacle_range: 30.0
          min_obstacle_height: 0.1
          max_obstacle_height: 2.5
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false

          filter: "voxel"
          voxel_min_points: 1
          clear_after_reading: true

          # Sensor model / FOV params
          min_z: -1.0
          max_z: 3.0
          vertical_fov_angle: 0.52
          horizontal_fov_angle: 6.28
          decay_acceleration: 5.0
          model_type: 1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0



local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 50
      height: 50
      resolution: 0.15

      # footprint: "[[2.2,0.7],[2.2,-0.7],[-0.8,-0.7],[-0.8,0.7]]"
      footprint: "[[3.3,1.25],[3.3,-1.25],[-1.2,-1.25],[-1.2,1.25]]"


      track_unknown_space: false
      always_send_full_costmap: true

      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        # If you have Patchwork++ or another ground filter, use its nonground output:
        observation_sources: nonground
        nonground:
          topic: /patchworkpp/nonground         # <-- change to your topic
          data_type: "PointCloud2"
          marking: true
          clearing: true

          # ranges (tune)
          obstacle_min_range: 1.0
          obstacle_max_range: 25.0
          raytrace_min_range: 1.0
          raytrace_max_range: 30.0

          # height band in base_link (tune; keep permissive at first)
          min_obstacle_height: 0.0
          max_obstacle_height:  5.0

          expected_update_rate: 0.0
          inf_is_valid: false
          observation_persistence: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.2
        cost_scaling_factor: 3.0




