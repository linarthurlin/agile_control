behavior_server:
  ros__parameters:
    global_frame: camera_init
    robot_base_frame: base_link
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"



planner_server:
  ros__parameters:
    global_frame: camera_init
    robot_base_frame: base_link
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["SmacHybrid"]
    SmacHybrid:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 4.3
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retries: 10
    global_frame: camera_init
    robot_base_frame: base_link

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: camera_init #base_link
      robot_base_frame: base_link
      footprint: "[[3.3,1.25],[3.3,-1.25],[-1.2,-1.25],[-1.2,1.25]]"
      rolling_window: true
      width: 50 #100
      height: 50 #100
      resolution: 0.20
      track_unknown_space: false

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        # If you have Patchwork++ or another ground filter, use its nonground output:
        observation_sources: velodyne #nonground
          #nonground:
        velodyne: 
          topic: /velodyne_points #/patchworkpp/nonground         # <-- change to your topic
          data_type: "PointCloud2"
          marking: true
          clearing: true

          # ranges (tune)
          obstacle_min_range: 1.0
          obstacle_max_range: 25.0
          raytrace_min_range: 1.0
          raytrace_max_range: 30.0

          # height band in base_link (tune; keep permissive at first)
          min_obstacle_height: -1.5 #-15.0
          max_obstacle_height:  15.0

          expected_update_rate: 0.0
          inf_is_valid: false
          observation_persistence: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 2.0
        cost_scaling_factor: 3.0
