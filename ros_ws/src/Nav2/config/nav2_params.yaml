

# STVL lyaer
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: camera_init #base_link
      robot_base_frame: base_link
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.10 #0.15
        #footprint: "[[2.2,0.7],[2.2,-0.7],[-0.8,-0.7],[-0.8,0.7]]"
      footprint: "[[3.3,1.25],[3.3,-1.25],[-1.2,-1.25],[-1.2,1.25]]"
      update_frequency: 15.0
      publish_frequency: 5.0
      transform_tolerance: 0.2
      track_unknown_space: false
      always_send_full_costmap: false #true
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        observation_sources: velodyne #nonground
        voxel_size: 0.15 #0.08 #0.15
        voxel_decay: 0.5 #1.0
        decay_model: 0
        # mark_threshold: 0
        # unknown_threshold: 15
        # publish_voxel_map: true
        #nonground:
        velodyne:
          topic: /velodyne_points #/patchworkpp/nonground
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: -1.50 #0.0
          max_obstacle_height: 3.0
          obstacle_range: 12.0 #25.0
          raytrace_range: 15.0 #30.0
          expected_update_rate: 0.0
          inf_is_valid: false
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.3
        cost_scaling_factor: 3.0



controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    # Nav2 controllers output to cmd_vel by default
    cmd_vel_topic: /cmd_vel

    # Important: make sure this matches your base_link topic/frame
    base_link_topic: /Odometry

    global_frame: camera_init
    robot_base_frame: base_link

    # Required plugins
    controller_plugins: ["FollowPath"]
    current_goal_checker: "goal_checker"
    current_progress_checker: "progress_checker"

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Don't let planner send reverse or rotate in place commands
      use_rotate_to_heading: false
      allow_reversing: false

      # --- Core tuning knobs ---
      desired_linear_vel: 2.0
      transform_tolerance: 0.2

      use_velocity_scaled_lookahead_dist: false #true
      min_lookahead_dist: 3.0
      max_lookahead_dist: 12.0
      lookahead_dist: 6.0                 # (not used when velocity_scaled is true, but keep sane)

      velocity_scaled_lookahead_dist: 2.0  # multiplier
      min_velocity_scaled_lookahead_dist: 3.0
      max_velocity_scaled_lookahead_dist: 12.0

      use_rotate_to_heading: false
      allow_reversing: false

      # Regulation (slows down near obstacles / high curvature)
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: true #false

      # limits (match what your platform can do)
      # max_angular_accel: 0.6
      # max_robot_pose_search_dist: 10.0

    # Progress Checker and Goal Checker which are required by Nav2
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 2.0 #4.0 #0.8
      yaw_goal_tolerance: 1.0 #3.14 #0.5
      stateful: true

# velocity_smoother:
#   ros__parameters:
#     max_velocity: [5.0, 0.0, 0.8]      # vx m/s, vy m/s, wz rad/s
#     min_velocity: [0.0, 0.0, -0.8]     # no reverse; allow +/- wz
#     max_accel:    [0.8, 0.0, 1.0]      # m/s^2 and rad/s^2
#     max_decel:    [-1.2, 0.0, -1.5]    # negative numbers in Nav2 smoother

velocity_smoother:
  ros__parameters:
    max_velocity: [3.0, 0.0, 0.8]
    min_velocity: [0.0, 0.0, -0.8]
    max_accel:    [0.6, 0.0, 1.2]
    max_decel:    [-8.0, 0.0, -2.0]


