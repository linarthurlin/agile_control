local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 50
      height: 50
      resolution: 0.15

      # footprint: "[[2.2,0.7],[2.2,-0.7],[-0.8,-0.7],[-0.8,0.7]]"
      footprint: "[[3.3,1.25],[3.3,-1.25],[-1.2,-1.25],[-1.2,1.25]]"


      track_unknown_space: false
      always_send_full_costmap: true

      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        # If you have Patchwork++ or another ground filter, use its nonground output:
        observation_sources: nonground
        nonground:
          topic: /patchworkpp/nonground         # <-- change to your topic
          data_type: "PointCloud2"
          marking: true
          clearing: true

          # ranges (tune)
          obstacle_min_range: 1.0
          obstacle_max_range: 25.0
          raytrace_min_range: 1.0
          raytrace_max_range: 30.0

          # height band in base_link (tune; keep permissive at first)
          min_obstacle_height: 0.0
          max_obstacle_height:  5.0

          expected_update_rate: 0.0
          inf_is_valid: false
          observation_persistence: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.2
        cost_scaling_factor: 3.0





controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    cmd_vel_topic: /cmd_vel
    odom_topic: /Odometry
    global_frame: odom
    robot_base_frame: base_link

    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      use_rotate_to_heading: false
      allow_reversing: false

      desired_linear_vel: 2.0
      transform_tolerance: 0.2

      use_velocity_scaled_lookahead_dist: true #false
      lookahead_time: 10.0
      # if use_velocity_scaled_lookahead_dist is set to true, the lookahead point is scaled based on velocity, but 
      # still capped to within these values
      min_lookahead_dist: 3.0
      max_lookahead_dist: 12.0
      # This value is MANDATORY. It is used as the base value
      lookahead_dist: 6.0

      use_collision_detection: false
      # max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      interpolate_curvature_after_goal: false
      use_dynamic_window: false
      allow_obstacle_checking_beyond_goal: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 2.0
      yaw_goal_tolerance: 1.0
      stateful: false #true

# velocity_smoother:
#   ros__parameters:
#     max_velocity: [5.0, 0.0, 0.8]      # vx m/s, vy m/s, wz rad/s
#     min_velocity: [0.0, 0.0, -0.8]     # no reverse; allow +/- wz
#     max_accel:    [0.8, 0.0, 1.0]      # m/s^2 and rad/s^2
#     max_decel:    [-1.2, 0.0, -1.5]    # negative numbers in Nav2 smoother

# velocity_smoother:
#   ros__parameters:
#     max_velocity: [3.0, 0.0, 0.8]
#     min_velocity: [0.0, 0.0, -0.8]
#     max_accel:    [0.50, 0.0, 1.0]
#     max_decel:    [-8.0, 0.0, -2.0] # allow quicker deceleration

velocity_smoother:
  ros__parameters:
    max_velocity: [3.0, 0.0, 0.45]
    min_velocity: [0.0, 0.0, -0.45]
    max_accel:    [0.55, 0.0, 0.6]
    max_decel:    [-8.0, 0.0, -2.0]


