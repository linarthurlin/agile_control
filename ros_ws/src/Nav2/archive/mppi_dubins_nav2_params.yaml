# https://github.com/ros-navigation/navigation2/tree/humble/nav2_smac_planner
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    global_frame: odom
    robot_base_frame: base_link
    use_sim_time: false

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 4.5
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 22.5 # 15.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 200
      height: 200
      resolution: 0.20
      track_unknown_space: false

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: false
        publish_voxel_map: false

        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 2.0
        obstacle_max_range: 40.0
        obstacle_min_range: 0.8

        observation_sources: vlp32
        vlp32:
          topic: /velodyne_points
          data_type: "PointCloud2"
          marking: true
          clearing: true

          raytrace_max_range: 45.0
          raytrace_min_range: 0.8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 2.0
        cost_scaling_factor: 3.0